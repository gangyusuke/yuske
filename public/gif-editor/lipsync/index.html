<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>口パクアニメメーカー</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div>
        <h1>🗣️ 口パクアニメメーカー</h1>
        <p class="subtitle">顔画像に口の形を重ねて、しゃべっているようなアニメGIFを作ります</p>
      </div>
      <a class="back-link" href="../index.html">← GIFエディタに戻る</a>
    </header>

    <main class="editor">
      <!-- 素材パネル -->
      <section class="panel materials-panel">
        <h2>① 素材をアップロード</h2>
        <p class="hint">
          必要な素材: ベースになる顔画像1枚と、口の形の画像を2枚以上（閉じている状態→開いている状態の順）。
          口の画像は背景が透明なPNGがおすすめです。
        </p>

        <div class="field-block">
          <label class="file-btn">
            ベース画像（顔）を選択
            <input type="file" id="baseImageInput" accept="image/*" hidden />
          </label>
          <div id="baseImageStatus" class="status-text">未選択</div>
        </div>

        <div class="field-block">
          <div class="row-header">
            <span>口の形（閉じ → 開くの順に並べてください）</span>
            <button type="button" id="addShapeBtn" class="secondary-btn">＋ 口の形を追加</button>
          </div>
          <ol id="shapeList" class="shape-list"></ol>
        </div>
      </section>

      <!-- プレビュー・位置調整パネル -->
      <section class="panel preview-panel">
        <h2>② 口の位置を合わせる</h2>
        <p class="hint">プレビュー上をドラッグして口の位置を調整できます。</p>
        <div class="canvas-wrap">
          <canvas id="previewCanvas" width="320" height="320"></canvas>
        </div>
        <div class="pos-controls">
          <label>X% <input type="number" id="posX" min="0" max="100" value="50" /></label>
          <label>Y% <input type="number" id="posY" min="0" max="100" value="70" /></label>
          <label>幅% <input type="number" id="posWidth" min="2" max="100" value="25" /></label>
        </div>
        <div class="preview-controls">
          <button type="button" id="playBtn" class="secondary-btn" disabled>▶ 再生</button>
          <span id="frameCounter" class="frame-counter">0 / 0</span>
        </div>
      </section>

      <!-- パターン生成パネル -->
      <section class="panel pattern-panel">
        <h2>③ しゃべり方を作る</h2>
        <div class="tabs">
          <button type="button" class="tab-btn active" data-tab="auto">オート（リズム）</button>
          <button type="button" class="tab-btn" data-tab="audio">音声に合わせる</button>
        </div>

        <div class="tab-panel" data-tab-panel="auto">
          <label class="field-row">
            パターン
            <select id="patternMode">
              <option value="alternate">交互（規則的にパクパク）</option>
              <option value="random">ランダム（自然な会話風）</option>
            </select>
          </label>
          <label class="field-row">
            1コマの時間(ms)
            <input type="number" id="frameMsInput" min="40" max="1000" value="150" />
          </label>
          <label class="field-row">
            長さ(秒)
            <input type="number" id="durationInput" min="0.5" max="30" step="0.5" value="3" />
          </label>
          <button type="button" id="generateAutoBtn" class="primary-btn full-width">この設定で生成</button>
        </div>

        <div class="tab-panel hidden" data-tab-panel="audio">
          <label class="file-btn full-width">
            音声ファイルを選択
            <input type="file" id="audioInput" accept="audio/*" hidden />
          </label>
          <div id="audioStatus" class="status-text">未選択</div>
          <label class="field-row">
            1コマの時間(ms)
            <input type="number" id="audioFrameMsInput" min="40" max="500" value="80" />
          </label>
          <label class="field-row">
            感度（大きいほど口が動きやすい）
            <input type="range" id="sensitivityRange" min="0" max="1" step="0.05" value="0.5" />
          </label>
          <button type="button" id="generateAudioBtn" class="primary-btn full-width" disabled>音声から生成</button>
        </div>

        <div class="export-block">
          <button type="button" id="exportBtn" class="primary-btn full-width" disabled>GIFを書き出す</button>
          <button type="button" id="handoffBtn" class="secondary-btn full-width" disabled>
            続きをGIFエディタで編集
          </button>
          <progress id="exportProgress" max="100" value="0" hidden></progress>
          <div id="resultWrap" class="result-wrap" hidden>
            <img id="resultImg" alt="生成されたGIF" />
            <a id="downloadLink" class="secondary-btn" download>ダウンロード</a>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="../vendor/gif.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
