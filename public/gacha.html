<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
</head>
<body>
<title>ガチャまとめメーカー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: 左に設定と商品リスト、右に生成した縦長画像のプレビュー棚。スマホでは縦に積む */
:root {
  --bg: #f2f4fa;
  --surface: #ffffff;
  --fg: #1b1e3c;
  --muted: #5d6388;
  --line: #dce0ee;
  --accent: #e8352e;
  --accent-ink: #ffffff;
  --coin: #ffc629;
  --soft: #e9ecf7;
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10122a; --surface: #1a1d3b; --fg: #eceef8; --muted: #a3a8c8;
    --line: #2d325e; --accent: #ff5a4f; --accent-ink: #ffffff; --coin: #ffd23f; --soft: #232750;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10122a; --surface: #1a1d3b; --fg: #eceef8; --muted: #a3a8c8;
  --line: #2d325e; --accent: #ff5a4f; --accent-ink: #ffffff; --coin: #ffd23f; --soft: #232750;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1200px; margin: 0 auto; display: grid; gap: 20px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
header.top h1 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 5vw, 36px); margin: 0; letter-spacing: .02em; }
header.top h1 span { color: var(--accent); }
header.top p { margin: 0; color: var(--muted); min-width: 0; }
.cols { display: grid; gap: 20px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 900px) { .cols { grid-template-columns: minmax(0, 430px) minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.panel h2 { margin: 0; font-size: 13px; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.stack { display: grid; gap: 20px; min-width: 0; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .lbl { font-size: 13px; font-weight: 700; color: var(--muted); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
input[type="text"], input[type="number"] {
  width: 100%; font: inherit; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0;
}
input:focus-visible, button:focus-visible, .seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: inline-block; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); font-weight: 700; font-size: 14px; background: var(--bg); }
.seg input:checked + span { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.swatch input { position: absolute; opacity: 0; pointer-events: none; }
.swatch i { width: 34px; height: 34px; border-radius: 50%; display: block; border: 3px solid transparent; box-shadow: 0 0 0 1px var(--line); }
.swatch input:checked + i { border-color: var(--fg); }
.swatch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }
.swatch b { font-size: 13px; font-weight: 700; }
.check { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
button { font: inherit; cursor: pointer; }
.btn { border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 900; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn:disabled { opacity: .5; cursor: default; }
.addbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.sample-note { background: var(--soft); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
.items { display: grid; gap: 10px; list-style: none; margin: 0; padding: 0; }
.item { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); }
.thumb { width: 76px; height: 76px; border-radius: 12px; border: 0; padding: 0; overflow: hidden; background: var(--soft); position: relative; color: var(--muted); font-size: 12px; font-weight: 700; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .rank { position: absolute; left: 4px; top: 4px; background: var(--fg); color: var(--bg); border-radius: 999px; padding: 0 7px; font-size: 11px; font-weight: 900; }
.item .fields { display: grid; gap: 6px; min-width: 0; }
.item .fields input { padding: 6px 8px; font-size: 14px; background: var(--surface); }
.item .mini { display: grid; grid-template-columns: 80px 1fr 1fr; gap: 6px; }
.item .tools { display: grid; gap: 4px; }
.icon { width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-weight: 900; line-height: 1; }
.chip { display: inline-block; font-size: 11px; font-weight: 900; padding: 1px 8px; border-radius: 999px; background: var(--coin); color: #1b1e3c; justify-self: start; }
.shelf-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.page { display: grid; gap: 6px; margin: 0; min-width: 0; }
.page img { width: 100%; aspect-ratio: 9 / 16; max-width: 100%; border-radius: 12px; display: block; background: var(--soft); box-shadow: 0 1px 0 var(--line); }
.page figcaption { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; }
.page button { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 900; }
textarea { width: 100%; min-height: 180px; font: inherit; font-size: 14px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px; resize: vertical; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .page img { transition: opacity .2s; } }
.busy .page img { opacity: .6; }
</style>

<div class="wrap">
  <header class="top">
    <h1>ガチャ<span>まとめ</span>メーカー</h1>
    <p>写真と商品名を入れるだけで、TikTok用の縦長画像（1080×1920）を自動で作ります。</p>
  </header>

  <div class="cols">
    <div class="stack">
      <section class="panel" aria-labelledby="h-set">
        <h2 id="h-set">設定</h2>
        <div class="field">
          <span class="lbl">種類</span>
          <div class="seg" role="radiogroup" aria-label="種類">
            <label><input type="radio" name="mode" id="mode-list" value="list" checked><span>新作まとめ</span></label>
            <label><input type="radio" name="mode" id="mode-rank" value="rank"><span>ランキング</span></label>
          </div>
        </div>
        <div class="row2">
          <div class="field"><label for="f-month">発売月</label><input type="text" id="f-month" value="10月"></div>
          <div class="field"><label for="f-handle">アカウント名</label><input type="text" id="f-handle" value="@your_gacha"></div>
        </div>
        <div class="field"><label for="f-title">タイトル</label><input type="text" id="f-title" value="新作ガチャまとめ"></div>
        <div class="field">
          <span class="lbl">中のページ</span>
          <div class="seg" role="radiogroup" aria-label="中のページ">
            <label><input type="radio" name="layout" id="lay-grid" value="grid" checked><span>4つずつ並べる</span></label>
            <label><input type="radio" name="layout" id="lay-single" value="single"><span>1商品1枚</span></label>
          </div>
        </div>
        <div class="field" id="rank-order-field" hidden>
          <span class="lbl">発表の順番</span>
          <div class="seg" role="radiogroup" aria-label="発表の順番">
            <label><input type="radio" name="order" id="ord-up" value="up" checked><span>下位から（最後に1位）</span></label>
            <label><input type="radio" name="order" id="ord-down" value="down"><span>1位から</span></label>
          </div>
        </div>
        <div class="field">
          <span class="lbl">色</span>
          <div class="swatches" role="radiogroup" aria-label="色">
            <label class="swatch"><input type="radio" name="theme" id="th-capsule" value="capsule" checked><i style="background:linear-gradient(135deg,#e8352e 50%,#e9f4ff 50%)"></i><b>カプセル</b></label>
            <label class="swatch"><input type="radio" name="theme" id="th-night" value="night"><i style="background:linear-gradient(135deg,#ff4f8b 50%,#15172e 50%)"></i><b>ナイト</b></label>
            <label class="swatch"><input type="radio" name="theme" id="th-mint" value="mint"><i style="background:linear-gradient(135deg,#14a37f 50%,#dff7ee 50%)"></i><b>ミント</b></label>
          </div>
        </div>
        <label class="check"><input type="checkbox" id="f-end" checked>最後に「フォローしてね」の画像を付ける</label>
      </section>

      <section class="panel" aria-labelledby="h-items">
        <h2 id="h-items">商品（上から順番に並びます）</h2>
        <div class="addbar">
          <label class="btn" for="f-photos" role="button" tabindex="0" id="add-label">写真をまとめて追加</label>
          <input type="file" id="f-photos" accept="image/*" multiple hidden>
          <button type="button" class="btn ghost" id="add-empty">写真なしで1件追加</button>
        </div>
        <p class="sample-note" id="sample-note">いま入っているのは<b>見本のサンプル</b>です。写真を追加すると自動で消えます。</p>
        <ul class="items" id="items"></ul>
        <input type="file" id="f-one" accept="image/*" hidden>
      </section>
    </div>

    <div class="stack">
      <section class="panel" aria-labelledby="h-out">
        <div class="shelf-head">
          <h2 id="h-out">できた画像 <span id="count"></span></h2>
          <button type="button" class="btn" id="save-zip">まとめて保存（ZIP）</button>
        </div>
        <p class="note" id="save-hint">TikTokの「写真」投稿にそのまま並べて使えます。保存できないときは、画像を長押しして保存してください。</p>
        <div class="shelf" id="shelf"></div>
      </section>

      <section class="panel" aria-labelledby="h-cap">
        <div class="shelf-head">
          <h2 id="h-cap">キャプション案</h2>
          <button type="button" class="btn ghost" id="copy-cap">コピー</button>
        </div>
        <textarea id="caption" aria-label="キャプション案"></textarea>
      </section>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(() => {
  const W = 1080, H = 1920;
  const DISPLAY = '"Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif';
  const BODY = '"Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif';
  const THEMES = {
    capsule: { bg: '#e9f4ff', dotA: '#e8352e', dotB: '#ffc629', primary: '#e8352e', onPrimary: '#ffffff', ink: '#1b1e3c', muted: '#5d6388', card: '#ffffff', cardInk: '#1b1e3c', coin: '#ffc629', coinRim: '#d99a00', coinInk: '#3b2a00' },
    night:   { bg: '#15172e', dotA: '#ff4f8b', dotB: '#ffd23f', primary: '#ff4f8b', onPrimary: '#ffffff', ink: '#ffffff', muted: '#b4b8d8', card: '#23264a', cardInk: '#ffffff', coin: '#ffd23f', coinRim: '#c99a00', coinInk: '#3b2a00' },
    mint:    { bg: '#dff7ee', dotA: '#14a37f', dotB: '#ff8a3d', primary: '#14a37f', onPrimary: '#ffffff', ink: '#12302a', muted: '#4c6b63', card: '#ffffff', cardInk: '#12302a', coin: '#ffc629', coinRim: '#d99a00', coinInk: '#3b2a00' },
  };
  const MEDAL = ['#f5b400', '#aeb7c4', '#cd7f45'];
  const DEFAULT_TITLE = { list: '新作ガチャまとめ', rank: '神ガチャランキング' };
  const STORE_KEY = 'gachaMaker.v1';

  const $ = (id) => document.getElementById(id);
  let uid = 0;
  const state = {
    mode: 'list', layout: 'grid', order: 'up', theme: 'capsule',
    month: '10月', handle: '@your_gacha', title: DEFAULT_TITLE.list, end: true,
    items: [],
  };

  // ---------- 保存されている設定（写真は保存しない） ----------
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (saved) for (const k of ['mode', 'layout', 'order', 'theme', 'month', 'handle', 'title', 'end']) if (k in saved) state[k] = saved[k];
  } catch (e) { /* 保存できない環境でも動く */ }
  function persist() {
    try {
      const { items, ...rest } = state;
      localStorage.setItem(STORE_KEY, JSON.stringify(rest));
    } catch (e) { /* noop */ }
  }

  // ---------- 描画の小道具 ----------
  function rr(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function drawCover(ctx, img, x, y, w, h) {
    const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
    const s = Math.max(w / iw, h / ih);
    const sw = w / s, sh = h / s;
    ctx.drawImage(img, (iw - sw) / 2, (ih - sh) / 2, sw, sh, x, y, w, h);
  }
  function fitFont(ctx, text, family, weight, maxW, start, min) {
    let size = start;
    for (; size > min; size -= 2) {
      ctx.font = `${weight} ${size}px ${family}`;
      if (ctx.measureText(text).width <= maxW) break;
    }
    ctx.font = `${weight} ${size}px ${family}`;
    return size;
  }
  const NO_START = 'ー、。，．）」』】！？…ぁぃぅぇぉゃゅょっァィゥェォャュョッ';
  // 日本語は1文字単位で折り返す
  function wrap(ctx, text, maxW, maxLines) {
    const chars = Array.from(text || '');
    const lines = [];
    let line = '', i = 0;
    for (; i < chars.length; i++) {
      const t = line + chars[i];
      if (ctx.measureText(t).width > maxW && line) {
        // 「ー」「。」などが行頭に来ないよう、前の1文字ごと次の行へ送る
        let carry = '';
        if (NO_START.includes(chars[i]) && line.length > 1) { carry = line.slice(-1); line = line.slice(0, -1); }
        lines.push(line);
        line = carry + chars[i];
        if (lines.length === maxLines) { line = ''; break; }
      } else line = t;
    }
    if (line && lines.length < maxLines) { lines.push(line); i = chars.length; }
    if (i < chars.length && lines.length) {
      let last = lines[lines.length - 1];
      while (last && ctx.measureText(last + '…').width > maxW) last = last.slice(0, -1);
      lines[lines.length - 1] = last + '…';
    }
    return lines;
  }
  function seeded(seed) {
    let s = seed * 9301 + 49297;
    return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  }
  function drawCapsule(ctx, cx, cy, r, top, bottom, alpha = 1) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, 0); ctx.closePath(); ctx.fillStyle = top; ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI); ctx.closePath(); ctx.fillStyle = bottom; ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(cx - r, cy - r * 0.04, r * 2, r * 0.08);
    ctx.beginPath(); ctx.ellipse(cx - r * 0.38, cy - r * 0.5, r * 0.22, r * 0.12, -0.6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fill();
    ctx.restore();
  }
  function background(ctx, t, seed) {
    ctx.fillStyle = t.bg; ctx.fillRect(0, 0, W, H);
    const rnd = seeded(seed);
    for (let i = 0; i < 16; i++) {
      const r = 26 + rnd() * 46;
      drawCapsule(ctx, rnd() * W, rnd() * H, r, i % 2 ? t.dotA : t.dotB, t.card, 0.14);
    }
  }
  function pill(ctx, x, y, text, font, bg, fg, padX = 26, h = 64) {
    ctx.font = font;
    const w = ctx.measureText(text).width + padX * 2;
    rr(ctx, x, y, w, h, h / 2); ctx.fillStyle = bg; ctx.fill();
    ctx.fillStyle = fg; ctx.textBaseline = 'middle'; ctx.fillText(text, x + padX, y + h / 2 + 2);
    ctx.textBaseline = 'alphabetic';
    return w;
  }
  function priceDigits(p) { return String(p ?? '').replace(/[^\d]/g, ''); }
  function coin(ctx, cx, cy, r, price, t) {
    const d = priceDigits(price);
    if (!d) return;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = r * 0.25; ctx.shadowOffsetY = r * 0.08;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fillStyle = t.coin; ctx.fill();
    ctx.restore();
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.84, 0, Math.PI * 2); ctx.lineWidth = r * 0.06; ctx.strokeStyle = t.coinRim; ctx.stroke();
    ctx.fillStyle = t.coinInk; ctx.textAlign = 'center';
    fitFont(ctx, d, DISPLAY, 400, r * 1.35, r * 0.7, 10);
    ctx.fillText(d, cx, cy + r * 0.16);
    ctx.font = `900 ${Math.round(r * 0.3)}px ${BODY}`;
    ctx.fillText('円', cx, cy + r * 0.55);
    ctx.textAlign = 'left';
  }
  function photoOrPlaceholder(ctx, item, x, y, w, h, r, t) {
    ctx.save();
    rr(ctx, x, y, w, h, r); ctx.clip();
    if (item && item.img) drawCover(ctx, item.img, x, y, w, h);
    else {
      ctx.fillStyle = t.bg; ctx.fillRect(x, y, w, h);
      drawCapsule(ctx, x + w / 2, y + h / 2 - h * 0.06, Math.min(w, h) * 0.22, t.primary, t.card);
      ctx.fillStyle = t.muted; ctx.textAlign = 'center';
      ctx.font = `700 ${Math.round(Math.min(w, h) * 0.07)}px ${BODY}`;
      ctx.fillText('写真なし', x + w / 2, y + h / 2 + Math.min(w, h) * 0.28);
      ctx.textAlign = 'left';
    }
    ctx.restore();
  }
  function crown(ctx, x, y, s, color) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.8);
    ctx.lineTo(x, y + s * 0.25);
    ctx.lineTo(x + s * 0.28, y + s * 0.5);
    ctx.lineTo(x + s * 0.5, y);
    ctx.lineTo(x + s * 0.72, y + s * 0.5);
    ctx.lineTo(x + s, y + s * 0.25);
    ctx.lineTo(x + s, y + s * 0.8);
    ctx.closePath();
    ctx.fillStyle = color; ctx.fill();
  }
  function header(ctx, t, label, indicator) {
    pill(ctx, 56, 150, label, `900 36px ${BODY}`, t.primary, t.onPrimary);
    if (indicator) {
      ctx.font = `400 44px ${DISPLAY}`; ctx.fillStyle = t.muted; ctx.textAlign = 'right';
      ctx.fillText(indicator, W - 130, 198); ctx.textAlign = 'left';
    }
  }

  // ---------- ページの種類 ----------
  function mosaic(ctx, items, t, y0, blur) {
    const shown = items.slice(0, 6);
    const cols = 3, gap = 24, tw = (888 - gap * 2) / cols, th = 300;
    const n = Math.max(shown.length, 1);
    const rows = Math.ceil(n / cols);
    for (let i = 0; i < n; i++) {
      const c = i % cols, r = Math.floor(i / cols);
      const inRow = Math.min(cols, n - r * cols);
      const offset = (888 - (inRow * tw + (inRow - 1) * gap)) / 2;
      const x = 56 + offset + c * (tw + gap), y = y0 + r * (th + gap + 20) + (rows === 1 ? 140 : 0);
      ctx.save();
      ctx.translate(x + tw / 2, y + th / 2);
      ctx.rotate((i % 2 ? 1 : -1) * 0.04);
      ctx.shadowColor = 'rgba(0,0,0,.22)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;

    ['宇宙食ミニチュアコレクション', 400, '#7a5cff', '#f3f0ff', ['#e6e0ff', '#cfc4ff'], '10月第4週'],
  ];
  state.items = SAMPLES.map(([name, price, top, bottom, bg, date], i) => ({
    id: ++uid, img: sampleImage(top, bottom, bg, i + 1), name, price: String(price), maker: 'メーカー名', date, sample: true,
  }));

  // フォントを読み込んでから描く（読み込めなくても代わりの字体で描く）
  renderItems();
  Promise.all(state.items.map((it) => (it.img.decode ? it.img.decode().catch(() => {}) : null))).then(render);
  getDownloads();
})();
</script>
